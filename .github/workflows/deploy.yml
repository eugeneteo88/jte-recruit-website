name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate the blog index + sitemap from blog/posts.json so any post
      # whose publish date has arrived (Singapore time) is included.
      - name: Build blog
        run: node scripts/build-blog.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Publish as a single commit with no history, so the gh-pages branch
          # never accumulates old (or confidential) files in its git history.
          force_orphan: true
          # Keep build tooling + raw data off the public site.
          exclude_assets: '.github,salary-data.mjs,build-salary.mjs,salary-data.json,growth-report.mjs,.ga-key.json'
