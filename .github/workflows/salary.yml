name: Refresh salary guide

# Weekly refresh of the Salary Guide, then redeploy the whole site.
# Runs Saturday 00:30 Singapore time (Fri 16:30 UTC) so the "last updated"
# date always lands on a weekend. Pulls the latest market picture, rebuilds
# every salary-guide page, and redeploys. If the data comes back thin the
# engine aborts (non-zero) and nothing is deployed — the last good site stays.

on:
  schedule:
    - cron: '30 16 * * 5'   # Fri 16:30 UTC = Sat 00:30 Singapore time
  workflow_dispatch:         # manual "refresh now" from the Actions tab

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the latest market picture
        run: node salary-data.mjs

      - name: Rebuild the salary-guide pages
        run: node build-salary.mjs

      - name: Regenerate blog index + sitemap
        run: node scripts/build-blog.mjs

      # Without this, the refresh is thrown away. salary.yml deploys fresh data
      # but never commits it, while deploy.yml runs `npm run build` on every push
      # to main, which rebuilds the salary pages from the repo's copy of
      # salary-data.json and overwrites the fresh version. The committed file was
      # last refreshed 25 Jul 2026, so that July snapshot won every deploy and the
      # guide sat ~4 months stale in public.
      - name: Commit the refreshed data so the next deploy keeps it
        run: |
          git config user.name "jte-salary-bot"
          git config user.email "bot@users.noreply.github.com"
          git add salary-data.json salary-guide sitemap.xml
          if git diff --cached --quiet; then
            echo "no change in salary data"
          else
            git commit -m "chore: refresh salary guide data (MyCareersFuture)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push skipped"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          # Keep build tooling + raw data off the public site.
          exclude_assets: '.github,salary-data.mjs,build-salary.mjs,salary-data.json,growth-report.mjs,seo-data.mjs,keyword-targets.mjs,build-updates.mjs,content-ops,.ga-key.json'
