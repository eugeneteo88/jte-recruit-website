name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject portal config
        env:
          PORTAL_INGEST_SECRET: ${{ secrets.PORTAL_INGEST_SECRET }}
          CRM_PORTAL_API_URL: https://app.jte.com.sg/api/crm/portal-applications
        run: node scripts/inject-portal-config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Publish as a single commit with no history, so the gh-pages branch
          # never accumulates old (or confidential) files in its git history.
          force_orphan: true
