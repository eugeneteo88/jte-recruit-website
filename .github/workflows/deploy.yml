name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate blog + salary pages, then rebuild Tailwind CSS from the
      # current HTML so any newly-used utility class is always compiled in
      # (prevents stale prebuilt CSS). One command — see package.json "build".
      - name: Build site (blog + salary + CSS)
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Publish as a single commit with no history, so the gh-pages branch
          # never accumulates old (or confidential) files in its git history.
          force_orphan: true
          # Keep build tooling + raw data off the public site.
          exclude_assets: '.github,node_modules,package.json,package-lock.json,tailwind.config.cjs,assets/tw-input.css,salary-data.mjs,build-salary.mjs,salary-data.json,growth-report.mjs,keyword-targets.mjs,.ga-key.json'
