name: Scheduled publish

# Reveals blog posts on their scheduled date without anyone pushing.
# Each day it regenerates the blog index + sitemap from blog/posts.json
# (Singapore-time date filter) and redeploys. Add a post with a future
# `date` in posts.json and it goes live automatically on that day.

on:
  schedule:
    - cron: '5 16 * * *'   # 16:05 UTC = 00:05 Singapore time, daily
  workflow_dispatch:        # allows a manual "publish now" from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate blog index + sitemap from posts.json
        run: node scripts/build-blog.mjs

      - name: Rebuild the work log (/updates) from updates.json + posts.json
        run: node build-updates.mjs

      # Refresh the private /seo dashboard from live Search Console + GA4,
      # reusing the same service account as the growth reports. Non-blocking:
      # if it fails, seo/data.json keeps its last good values and publish continues.
      - name: Refresh SEO dashboard data (GSC + GA4)
        run: |
          printf '%s' "$GA_KEY_JSON" > .ga-key.json
          node seo-data.mjs || echo "seo-data skipped"
          rm -f .ga-key.json
        env:
          GA_KEY_JSON: ${{ secrets.GA_KEY_JSON }}

      - name: Commit refreshed dashboard data if changed
        run: |
          git config user.name "jte-seo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seo/data.json
          git diff --cached --quiet && echo "No data change." || (git commit -m "chore: refresh SEO dashboard data" && (git push || echo "push skipped"))

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
          # Keep build tooling + raw data off the public site.
          exclude_assets: '.github,node_modules,scripts,qa-reports,package.json,package-lock.json,tailwind.config.cjs,assets/tw-input.css,salary-data.mjs,build-salary.mjs,salary-data.json,growth-report.mjs,keyword-targets.mjs,seo-data.mjs,build-updates.mjs,.ga-key.json'
