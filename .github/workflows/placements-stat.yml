name: Placements stat

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the number to the site (false = dry run, just print the count)'
        type: boolean
        default: false
  schedule:
    - cron: '0 20 * * 0'   # weekly — Sunday 20:00 UTC (Mon 04:00 SGT)

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
    steps:
      - uses: actions/checkout@v4
      - name: Count placements + update stat
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/update-placements.mjs
      - name: Commit + deploy if changed
        if: env.APPLY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html employers/index.html
          if git diff --cached --quiet; then
            echo "No change — placements figure unchanged."
          else
            git commit -m "Auto-update placements stat"
            git push
            # bot pushes don't trigger Deploy (loop guard), so dispatch it explicitly
            gh workflow run deploy.yml --repo "${{ github.repository }}"
          fi
